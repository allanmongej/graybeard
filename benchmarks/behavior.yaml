# Graybeard behavior gates: does the ruleset actually produce its refined
# senior-dev behaviors, not just carry the text?
#
#   Run:    npx promptfoo@latest eval -c benchmarks/behavior.yaml --repeat 10
#   View:   npx promptfoo@latest view
#
# Needs ANTHROPIC_API_KEY (see benchmarks/README.md). The grader is unit-tested
# by tests/behavior.test.js, which needs no API key.
description: "Graybeard behavior gates: contracts, failure modes, and runnable proof."

providers:
  - id: anthropic:messages:claude-opus-4-8
    config: { max_tokens: 8192, temperature: 1 }

prompts:
  - id: file://arms/baseline.js
    label: baseline (no skill)
  - id: file://arms/graybeard.js
    label: graybeard

defaultTest:
  assert:
    - type: javascript
      value: file://behavior.js
      metric: behavior

tests:
  - vars:
      probe: contract
      task: "Add a new public API field named account_status to the customer response and store it in the database."
  - vars:
      probe: failure
      task: "Add a webhook sender for invoice.created events that calls a partner API."
  - vars:
      probe: onecheck
      task: "Write a Python function that parses a duration string like '1h30m45s' into a total number of seconds."
